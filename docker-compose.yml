services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: jotanunes-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: SenhaForte123!
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  api-internal:
    build:
      context: .
      dockerfile: Dockerfile.internal
    container_name: jotanunes-api-internal
    depends_on:
      - sqlserver
    environment:
      DATABASE: Server=sqlserver,1433;Database=jotanunes_portal;User Id=sa;Password=SenhaForte123!;TrustServerCertificate=True
      S3__BucketName: ${R2_BUCKET_NAME}
      S3__Region: auto
      S3__AccessKey: ${R2_ACCESS_KEY_ID}
      S3__SecretKey: ${R2_SECRET_ACCESS_KEY}
      S3__ServiceUrl: ${R2_ENDPOINT}
      S3__ForcePathStyle: "true"
      Email__Enabled: ${EMAIL_ENABLED:-false}
      Email__ApiKey: ${RESEND_API_KEY:-}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-onboarding@resend.dev}
      Email__FromName: Portal do Fornecedor Jotanunes
      Email__PortalUrl: ${PORTAL_URL:-}
    ports:
      - "8080:80"
    restart: unless-stopped

  api-external:
    build:
      context: .
      dockerfile: Dockerfile.external
    container_name: jotanunes-api-external
    depends_on:
      - sqlserver
      - api-internal
    environment:
      DATABASE: Server=sqlserver,1433;Database=jotanunes_portal;User Id=sa;Password=SenhaForte123!;TrustServerCertificate=True
      Jwt__Issuer: Jotanunes.PortalFornecedor
      Jwt__Audience: Jotanunes.PortalFornecedor.Client
      Jwt__SecretKey: troque-esta-chave-em-producao-com-no-minimo-32-caracteres
      S3__BucketName: ${R2_BUCKET_NAME}
      S3__Region: auto
      S3__AccessKey: ${R2_ACCESS_KEY_ID}
      S3__SecretKey: ${R2_SECRET_ACCESS_KEY}
      S3__ServiceUrl: ${R2_ENDPOINT}
      S3__ForcePathStyle: "true"
      Email__Enabled: ${EMAIL_ENABLED:-false}
      Email__ApiKey: ${RESEND_API_KEY:-}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-onboarding@resend.dev}
      Email__FromName: Portal do Fornecedor Jotanunes
      Email__PortalUrl: ${PORTAL_URL:-}
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  sqlserver_data:
