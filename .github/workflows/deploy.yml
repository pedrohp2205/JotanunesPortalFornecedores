name: Deploy Azure

# Roda a cada push na main (ou manualmente): testa, gera as 3 imagens,
# envia para o ACR e atualiza os Container Apps em Spain Central.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "Documentos Jotanunes/**"
      - "Jotanunes.*.BddTests/**"
  workflow_dispatch:

# Nunca roda dois deploys ao mesmo tempo; o seguinte espera o atual terminar.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write # login no Azure via OIDC, sem senha guardada no GitHub
  contents: read

env:
  # Identificadores (não são segredos): o login só funciona para este repo na branch main.
  AZURE_CLIENT_ID: 887fec3e-918c-475f-bdf6-fd1bc9f5641d
  AZURE_TENANT_ID: a06b3f6c-8017-4b3d-babd-fbdb8569d09d
  AZURE_SUBSCRIPTION_ID: a8d6d7bd-c28e-4095-b013-4094cc924795
  RESOURCE_GROUP: jotanunes-residencia4
  ACR_NAME: jotanunesres4acr
  ACR_SERVER: jotanunesres4acr.azurecr.io

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Testes unitários
        run: |
          dotnet test Jotanunes.Tests/Jotanunes.Tests.csproj -c Release --nologo
          dotnet test Jotanunes.Worker.Tests/Jotanunes.Worker.Tests.csproj -c Release --nologo

  build:
    name: Imagem ${{ matrix.app }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [internal, external, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Login no ACR
        run: az acr login -n "$ACR_NAME"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.app }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.ACR_SERVER }}/jotanunes-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # A API interna sobe primeiro porque é ela que aplica as migrations no banco.
  deploy-internal:
    name: Deploy internal
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Atualizar container app
        run: |
          az extension add -n containerapp --upgrade -y --only-show-errors
          az containerapp update -g "$RESOURCE_GROUP" -n jotanunes-internal \
            --image "$ACR_SERVER/jotanunes-internal:${{ github.sha }}" -o none --only-show-errors
      - name: Smoke test
        run: ./.github/scripts/smoke-test.sh jotanunes-internal

  deploy-others:
    name: Deploy ${{ matrix.app }}
    needs: deploy-internal
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [external, worker]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Atualizar container app
        run: |
          az extension add -n containerapp --upgrade -y --only-show-errors
          az containerapp update -g "$RESOURCE_GROUP" -n jotanunes-${{ matrix.app }} \
            --image "$ACR_SERVER/jotanunes-${{ matrix.app }}:${{ github.sha }}" -o none --only-show-errors
      - name: Smoke test
        if: matrix.app == 'external'
        run: ./.github/scripts/smoke-test.sh jotanunes-external
